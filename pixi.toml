[workspace]
authors = ["Matteo Terreran <matteo.terreran@gmail.com>"]
channels = ["conda-forge"]
name = "ceres-playground"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]

configure = """
cmake -S . -B build -G Ninja \
      -DCMAKE_BUILD_TYPE=Debug
"""

build = { cmd = "cmake --build build", depends-on = ["configure"] }

[dependencies]
ceres-solver = ">=2.2.0,<3"
sophus = "*"
eigen = "*"
cmake = "*"
ninja = "*"
c-compiler = "*"
cxx-compiler = "*"